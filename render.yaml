services:
  - type: web
    name: smart-roster-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: smart_roster_dev
      - key: STORAGE_BACKEND
        value: mongodb
      - key: SMART_ROSTER_ENVIRONMENT
        value: production
      - key: SMART_ROSTER_ALLOWED_FRONTEND_ORIGINS
        sync: false
